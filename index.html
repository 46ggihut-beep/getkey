<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkitringXHub - Get Key</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d0f14; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #eaeaea; padding: 20px; }
  .card { background: #171a21; border: 1px solid #2a2f3a; border-radius: 14px; padding: 28px 24px; width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #ff5e5e; }
  p.sub { font-size: 13px; color: #8a8f99; margin: 0 0 20px; }
  button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: .5; }
  #getBtn { background: #ff5e5e; color: #fff; }
  .key-box { display: none; margin-top: 20px; background: #0d0f14; border: 1px dashed #3a3f4a; border-radius: 10px; padding: 14px; }
  #keyText { font-size: 15px; word-break: break-all; font-family: monospace; color: #7fffab; }
  #copyBtn { background: #2a2f3a; color: #eaeaea; }
  #timer { margin-top: 14px; font-size: 13px; color: #8a8f99; }
  #timer b { color: #ffd166; font-size: 16px; }
  #errBox { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2a2f3a; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="card">
  <h1>SkitringXHub</h1>
  <p class="sub">Nhấn nút bên dưới để lấy key (hạn dùng 6 tiếng)</p>
  <button id="getBtn" onclick="getKey()">GET KEY</button>
  <div id="errBox"></div>
  <div class="key-box" id="keyBox">
    <div id="keyText"></div>
    <button id="copyBtn" onclick="copyKey()">COPY KEY</button>
    <div id="timer">Còn lại: <b id="timeLeft">--:--:--</b></div>
  </div>
</div>
<div class="toast" id="toast">Đã copy key</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxdejVyfJUT3SG9pTEKMZGUI7jiMHO6kMhlRBtfEpvqDHyyAocFi7Ec4md_mPodrg/exec";
const STORAGE_KEY = "sxh_key_data";
let countdownInterval = null;
function saveKeyData(key, expireAt) { localStorage.setItem(STORAGE_KEY, JSON.stringify({ key, expireAt })); }
function loadKeyData() { try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function clearKeyData() { localStorage.removeItem(STORAGE_KEY); }
async function getKey() {
  const existing = loadKeyData();
  if (existing && existing.expireAt > Date.now()) { showKey(existing.key, existing.expireAt); return; }
  const btn = document.getElementById("getBtn");
  const errBox = document.getElementById("errBox");
  errBox.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Đang lấy key...";
  try {
    const res = await fetch(`${API_URL}?action=getkey`);
    const data = await res.json();
    if (!data.success) throw new Error(data.message || "Lỗi không xác định");
    saveKeyData(data.key, data.expireAt);
    showKey(data.key, data.expireAt);
  } catch (err) {
    errBox.textContent = "Lỗi lấy key: " + err.message + ". Thử lại sau.";
    errBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "GET KEY";
  }
}
function showKey(key, expireAt) {
  document.getElementById("keyText").textContent = key;
  document.getElementById("keyBox").style.display = "block";
  const btn = document.getElementById("getBtn");
  btn.disabled = false;
  btn.textContent = "GENERATE KEY MỚI (key cũ vẫn còn hạn)";
  startCountdown(expireAt);
}
function startCountdown(expireAt) {
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    const remain = expireAt - Date.now();
    if (remain <= 0) {
      clearInterval(countdownInterval);
      clearKeyData();
      document.getElementById("timeLeft").textContent = "00:00:00";
      document.getElementById("timer").innerHTML = "Key đã hết hạn — bấm GET KEY để lấy key mới";
      document.getElementById("getBtn").textContent = "GET KEY";
      return;
    }
    const h = Math.floor(remain / 3600000);
    const m = Math.floor((remain % 3600000) / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    document.getElementById("timeLeft").textContent = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }, 1000);
}
function copyKey() {
  const key = document.getElementById("keyText").textContent;
  navigator.clipboard.writeText(key).then(() => {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = key;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  });
}
window.onload = () => {
  const existing = loadKeyData();
  if (existing && existing.expireAt > Date.now()) { showKey(existing.key, existing.expireAt); }
};
</script>
</body>
</html>
